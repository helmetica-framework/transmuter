apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: TOUCHSTONE_NAME
spec:
  description: >-
    TODO describe what this touchstone proves. The steps below publish the chart
    to the athanor registry, let chrysopoeia turn it into a CRD and claim an
    instance. Everything is derived from Chart.yaml, so no edit is needed there.
    Add the assertions this test is about to the last step.
  steps:
    - name: publish the chart
      try:
        - script:
            content: |
              set -eu
              cd ../../..
              helm dependency build .
              helm package .
              ca=$(mktemp)
              trap 'rm -f "$ca"' EXIT
              kubectl -n kube-system get secret tls-server-certificate \
                -o jsonpath='{.data.ca\.crt}' | base64 -d > "$ca"
              chart=$(awk '/^name:/{print $2}' Chart.yaml)
              version=$(awk '/^version:/{print $2}' Chart.yaml)
              helm push "$chart-$version.tgz" oci://localhost:5000/charts --ca-file "$ca"

    - name: claim an instance and check its workload
      try:
        - script:
            content: awk '/^name:/{printf "%s", $2}' ../../../Chart.yaml
            outputs:
              - name: chart
                value: ($stdout)
        - script:
            content: awk '/^version:/{printf "%s", $2}' ../../../Chart.yaml
            outputs:
              - name: version
                value: ($stdout)
        - script:
            content: awk '/^version:/{split($2, v, "."); printf "%s", v[1]}' ../../../Chart.yaml
            outputs:
              - name: major
                value: ($stdout)
        # Hash of values.yaml, the file the CRD schema is generated from, plus
        # the test namespace chainsaw generated: every test gets its own API
        # group, so parallel runs and sibling tests never share a CRD.
        - script:
            content: |
              { cat ../../../values.yaml; echo "$NAMESPACE"; } \
                | sha256sum | cut -c1-8 | tr -d '\n'
            outputs:
              - name: id
                value: ($stdout)

        - apply:
            file: sources.yaml
        - assert:
            resource:
              apiVersion: helmetica.io/v1
              kind: CustomResourceDefinitionSource
              metadata:
                name: (join('', ['v', $major, '-', $id, '.', $chart]))
                namespace: hel-chrysopoeia
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

        # Chrysopoeia derives kind and plural from the chart, so both are read.
        - script:
            content: |
              kubectl get crd \
                -o jsonpath="{.items[?(@.spec.group=='v$MAJOR-$ID.$CHART.helmetica-bundles.io')].spec.names.kind}"
            env:
              - name: CHART
                value: ($chart)
              - name: MAJOR
                value: ($major)
              - name: ID
                value: ($id)
            outputs:
              - name: kind
                value: ($stdout)
        - script:
            content: |
              kubectl get crd \
                -o jsonpath="{.items[?(@.spec.group=='v$MAJOR-$ID.$CHART.helmetica-bundles.io')].metadata.name}"
            env:
              - name: CHART
                value: ($chart)
              - name: MAJOR
                value: ($major)
              - name: ID
                value: ($id)
            outputs:
              - name: crd
                value: ($stdout)

        - apply:
            file: instance.yaml
        - assert:
            resource:
              apiVersion: (join('', ['v', $major, '-', $id, '.', $chart, '.helmetica-bundles.io/bundle']))
              kind: ($kind)
              metadata:
                name: instance
              status:
                releaseStatus: Ready

        # Chrysopoeia releases the chart into a namespace of its own.
        - script:
            content: kubectl -n $NAMESPACE get $CRD instance -o jsonpath='{.status.instanceNamespace}'
            env:
              - name: CRD
                value: ($crd)
            outputs:
              - name: instanceNs
                value: ($stdout)
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: instance
                namespace: ($instanceNs)
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

        # TODO add what this touchstone is about. The bindings above are ready
        # to use: $chart, $version, $major, $id, $kind, $crd and $instanceNs,
        # the namespace the reagent's workload was released into.
        # - assert:
        #     resource:
        #       apiVersion: apps/v1
        #       kind: StatefulSet
        #       metadata:
        #         name: myservice
        #         namespace: ($instanceNs)
        #       (status.readyReplicas == spec.replicas): true

      catch:
        - describe:
            apiVersion: helmetica.io/v1
            kind: CustomResourceDefinitionSource
            namespace: hel-chrysopoeia
        - describe:
            apiVersion: source.toolkit.fluxcd.io/v1
            kind: OCIRepository
            namespace: hel-chrysopoeia
        - describe:
            apiVersion: helmetica.io/v1
            kind: InstanceRevision
        - podLogs:
            namespace: hel-chrysopoeia
            selector: control-plane=controller-manager
            tail: 50
      cleanup:
        # Chrysopoeia owns the generated CRD, chainsaw does not clean it up.
        - script:
            content: kubectl delete crd $CRD --ignore-not-found
            env:
              - name: CRD
                value: ($crd)
